name: Release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    uses: ./.github/workflows/build.yml
    with:
      build_type: debug
  release:
    uses: ./.github/workflows/build.yml
    with:
      build_type: release
  publish:
    # Only main branch updates publish a release. The reusable builds above still
    # run for a manual dispatch from any branch, but only main/master publishes.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [debug, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bmcforge-release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: bmcforge-debug-*
          path: dist
          merge-multiple: true
      - name: Derive versioned build tag
        id: tag
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          STAMP=$(date -u +%Y%m%d%H%M%S)
          echo "tag=v${VERSION}-build.${STAMP}" >> "$GITHUB_OUTPUT"
      - name: Check version tag and complete artifact set
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/check_release.py
      - name: Publish release with debug and release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "BMCForge $RELEASE_TAG"
