name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builds:
    uses: ./.github/workflows/build.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bmcforge-*
          path: dist
          merge-multiple: true
      - name: Check version tag and complete artifact set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes --title "BMCForge $RELEASE_TAG"
