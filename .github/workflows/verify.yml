name: Verify
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # Never cancel an in-flight main/master run: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path vendor/ipmi/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python -m unittest discover -s tests -v
      - run: cargo run --locked -p bmcforge -- validate-profiles
      - run: cargo run --locked -p bmcforge -- validate-locales
      - run: cargo run --locked -p bmcforge -- validate-models
      - run: cargo run --locked -p bmcforge -- --config examples/config.toml validate-config
      - name: Ensure committed profile schema is current
        shell: bash
        run: |
          cargo run --locked -q -p bmcforge -- profile-schema > /tmp/profile.schema.json
          python -c "import json; assert json.load(open('profiles/schema.json')) == json.load(open('/tmp/profile.schema.json'))"
          cargo run --locked -q -p bmcforge -- model-schema > /tmp/model.schema.json
          cargo run --locked -q -p bmcforge -- locale-schema > /tmp/locale.schema.json
          python -c "import json; assert json.load(open('profiles/models/schema.json')) == json.load(open('/tmp/model.schema.json')); assert json.load(open('locales/schema.json')) == json.load(open('/tmp/locale.schema.json'))"
  native-tests:
    needs: quality
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --manifest-path vendor/ipmi/Cargo.toml --locked --no-default-features --features blocking --lib
      - run: cargo run --locked -p bmcforge -- demo-check
  debug-builds:
    # Eight-target debug packages on every ref, gated behind quality and native tests.
    needs: native-tests
    uses: ./.github/workflows/build.yml
    with:
      build_type: debug
  release-builds:
    # main/master additionally produces release packages, serially after the debug ones.
    needs: debug-builds
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build.yml
    with:
      build_type: release
  publish:
    # Only main/master updates publish a release.
    needs: [debug-builds, release-builds]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bmcforge-release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: bmcforge-debug-*
          path: dist
          merge-multiple: true
      - name: Derive versioned build tag
        id: tag
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          STAMP=$(date -u +%Y%m%d%H%M%S)
          echo "tag=v${VERSION}-build.${STAMP}" >> "$GITHUB_OUTPUT"
      - name: Check version tag and complete artifact set
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/check_release.py
      - name: Publish release with debug and release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "BMCForge $RELEASE_TAG"
