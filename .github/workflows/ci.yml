name: Checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path vendor/ipmi/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python -m unittest discover -s tests -v
      - run: cargo run --locked -p bmcforge -- validate-profiles
      - run: cargo run --locked -p bmcforge -- validate-locales
      - run: cargo run --locked -p bmcforge -- validate-models
      - run: cargo run --locked -p bmcforge -- --config examples/config.toml validate-config
      - name: Ensure committed profile schema is current
        shell: bash
        run: |
          cargo run --locked -q -p bmcforge -- profile-schema > /tmp/profile.schema.json
          python -c "import json; assert json.load(open('profiles/schema.json')) == json.load(open('/tmp/profile.schema.json'))"
          cargo run --locked -q -p bmcforge -- model-schema > /tmp/model.schema.json
          cargo run --locked -q -p bmcforge -- locale-schema > /tmp/locale.schema.json
          python -c "import json; assert json.load(open('profiles/models/schema.json')) == json.load(open('/tmp/model.schema.json')); assert json.load(open('locales/schema.json')) == json.load(open('/tmp/locale.schema.json'))"
  native-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --manifest-path vendor/ipmi/Cargo.toml --locked --no-default-features --features blocking --lib
      - run: cargo run --locked -p bmcforge -- demo-check
